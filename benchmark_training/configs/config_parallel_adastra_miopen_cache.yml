backend: submitit
slurm_time: 7200
slurm_stderr_to_stdout: True
# Shared cryo environment (bench_rocm/ADASTRA_SETUP.md); expanded in the job.
slurm_python: $SHAREDWORKDIR/env_cryo/.venv/bin/python
slurm_additional_parameters:
  cpus-per-task: 16
  account: <your_project>   
  constraint: MI300
slurm_setup:
  # Activates the venv and loads ROCm 10, gcc and fftw. Must come first: it
  # runs `module purge`.
  - source $SHAREDWORKDIR/env_cryo/.venv/bin/activate.poverlay
  # MIOpen cache on node-local /tmp (Lustre file locks time out), seeded from
  # and saved back to $MIOPEN_CACHE_STORE so the kernel search is paid once.
  # Fill it with one cudnn_benchmark=true job per new shape config, then run
  # with cudnn_benchmark=false: benchmark=true always allocates the maximum
  # search workspace, even on a cache hit (epoch-1 memory spike).
  - export MIOPEN_CACHE_STORE=$SHAREDWORKDIR/miopen_cache
  - export MIOPEN_USER_DB_PATH=/tmp/${USER}-miopen-cache-${SLURM_JOB_ID}
  - export MIOPEN_CUSTOM_CACHE_DIR=$MIOPEN_USER_DB_PATH
  - mkdir -p $MIOPEN_CACHE_STORE
  # setup lines run on the first node only, but /tmp is per node: srun seeds
  # the cache on every node, otherwise ranks on other nodes search again.
  # One task per node; explicit flags so it does not inherit the training request.
  - srun --nodes=$SLURM_NNODES --ntasks=$SLURM_NNODES --ntasks-per-node=1 --cpus-per-task=1 bash -c 'mkdir -p $MIOPEN_USER_DB_PATH && cp -a $MIOPEN_CACHE_STORE/. $MIOPEN_USER_DB_PATH/'
  - export HSA_NO_SCRATCH_RECLAIM=1   # avoids RCCL degraded mode
  - export NCCL_DEBUG=INFO
# Saves the cache from the first node. Skipped if the job hits its time limit.
slurm_teardown:
  - cp -a $MIOPEN_USER_DB_PATH/. $MIOPEN_CACHE_STORE/
  - ls -la $MIOPEN_CACHE_STORE
