# For unrolled on 4 to 64 GPUs, compare distributing over all GPUs with distributing over groups + DDP.
objective:
  - reconstruction_objective

dataset:
  - cryo:
      volume_size: [[1024, 512, 1024]]
      num_angles: 41
      tilt_min: -60.0
      tilt_max: 60.0
      noise_level: 0.1
      seed: 42

solver:
  - Equivariant:
      preset: ["unrolled"]
      # unrolled
      n_iter: [2]
      init_stepsize: [0.9]
      train_algo_params: [false]
      # loss
      obs_gain: ["leastsq_xnet"]
      obs_ramp: [true]
      eq_weight: [2.0]
      eq_noise: [0.0]
      eq_scale_free: [false]
      # from patch_size.yml and speedup.yml
      patch_size: [128]
      overlap: [16]
      mixed_precision: ["bf16"]
      compile_model: [true]
      num_operators: ["auto"]
      # fixed
      tomography_backend: ["auto"]
      cudnn_benchmark: [false]
      distribute_model: [true]
      max_batch_size: [1]
      checkpoint_batches: [never]
      # profiling
      profiler_mode: [custom]
      profiler_per_step: [true]
      profiler_warmup: [0]
      # inner_world_size: null = all GPUs, k = groups of k GPUs + DDP
      slurm_gres, slurm_ntasks_per_node, slurm_nodes, inner_world_size: [
        # 4 GPUs
        ["gpu:4", 4, 1, null],
        ["gpu:4", 4, 1, 1],
        ["gpu:4", 4, 1, 2],
        # 16 GPUs
        ["gpu:4", 4, 4, null],
        ["gpu:4", 4, 4, 1],
        ["gpu:4", 4, 4, 2],
        ["gpu:4", 4, 4, 4],
        ["gpu:4", 4, 4, 8],

        # 32 GPUs
        ["gpu:4", 4, 8, null],
        ["gpu:4", 4, 8, 4],
        ["gpu:4", 4, 8, 8],
        ["gpu:4", 4, 8, 16],
        # 64 GPUs
        ["gpu:4", 4, 16, null],
        ["gpu:4", 4, 16, 4],
        ["gpu:4", 4, 16, 8],
        ["gpu:4", 4, 16, 16],
        ["gpu:4", 4, 16, 32],
      ]

max-runs: 5
n-repetitions: 1
plot: true
html: true
